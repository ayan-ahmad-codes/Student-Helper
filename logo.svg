<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle / App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow/Card Backing -->
  <g filter="url(#dropShadow)">
    <!-- Base Book Spine & Left Page -->
    <path d="M120 336 C120 250, 180 240, 256 250 L256 362 C180 352, 140 360, 120 380 Z" 
          fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Base Right Page -->
    <path d="M392 336 C392 250, 332 240, 256 250 L256 362 C332 352, 372 360, 392 380 Z" 
          fill="#E2E8F0" />
  </g>

  <!-- Mortarboard / Student Identity Cap -->
  <path d="M256 128 L396 196 L256 264 L116 196 Z" fill="url(#accentGrad)" />
  <path d="M344 240 L344 290 C344 316, 256 340, 256 340 C256 340, 168 316, 168 290 L168 240 L256 280 Z" 
        fill="#0284C7" />
  <!-- Tassel -->
  <path d="M376 208 L388 274" stroke="#FDE047" stroke-width="8" stroke-linecap="round" />
  <circle cx="388" cy="282" r="8" fill="#FDE047" />

  <!-- Checkmark (representing Tasks & Productivity) -->
  <circle cx="360" cy="360" r="44" fill="#10B981" />
  <path d="M344 360 L356 372 L378 348" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
